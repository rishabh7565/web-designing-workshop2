<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="number"]:focus {
            border-color: #007bff;
            outline: none;
        }
        .result-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            text-align: center;
        }
        .result-item {
            font-size: 18px;
            margin: 10px 0;
            color: #444;
        }
        .highlight {
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <h2>Simple Interest Calculator</h2>
    
    <!-- Input Fields -->
    <div class="input-group">
        <label for="principal">Principal Amount ($):</label>
        <input type="number" id="principal" value="1000" min="0" step="any">
    </div>
    
    <div class="input-group">
        <label for="rate">Annual Interest Rate (%):</label>
        <input type="number" id="rate" value="5" min="0" step="any">
    </div>
    
    <div class="input-group">
        <label for="time">Time Period (Years):</label>
        <input type="number" id="time" value="2" min="0" step="any">
    </div>
    
    <!-- Dynamic Output Fields -->
    <div class="result-container">
        <div class="result-item">Simple Interest: <span id="interest-output" class="highlight">$50.00</span></div>
        <div class="result-item">Total Balance: <span id="total-output" class="highlight">$1050.00</span></div>
    </div>
</div>

<script>
    // 1. Get references to DOM elements
    const principalInput = document.getElementById('principal');
    const rateInput = document.getElementById('rate');
    const timeInput = document.getElementById('time');
    const interestOutput = document.getElementById('interest-output');
    const totalOutput = document.getElementById('total-output');

    // 2. Define calculation logic
    function calculateInterest() {
        // Convert inputs to numbers
        const p = parseFloat(principalInput.value) || 0;
        const r = parseFloat(rateInput.value) || 0;
        const t = parseFloat(timeInput.value) || 0;

        // Formula: SI = (P * R * T) / 100
        const interest = (p * r * t) / 100;
        const total = p + interest;

        // 3. Update DOM dynamically
        interestOutput.textContent = `$${interest.toFixed(2)}`;
        totalOutput.textContent = `$${total.toFixed(2)}`;
    }

    // 4. Attach event listeners for real-time calculation
    principalInput.addEventListener('input', calculateInterest);
    rateInput.addEventListener('input', calculateInterest);
    timeInput.addEventListener('input', calculateInterest);
</script>

</body>
</html>
